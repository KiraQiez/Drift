name: Release packaging

on:
  push:
    branches: [staging]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Validate release ref and changelog
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
          uv run --locked python scripts/release_notes.py "$GITHUB_REF" release-notes.md
      - name: Build and validate distributions
        run: |
          uv export --locked --only-group build --no-emit-project --output-file "$RUNNER_TEMP/build-constraints.txt" > /dev/null
          uv build --no-create-gitignore --build-constraints "$RUNNER_TEMP/build-constraints.txt" --require-hashes --out-dir release-dist
          uv run --locked python scripts/check_distributions.py release-dist
          uvx --from twine==7.0.0 twine check --strict release-dist/*.whl release-dist/*.tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: distributions
          path: release-dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - name: Verify checksums and install distributions
        run: |
          uv run --locked python scripts/check_distributions.py release-dist --verify
          uv run --locked python scripts/smoke_distribution.py release-dist uv
          uv run --locked python scripts/smoke_distribution.py release-dist pipx

  homebrew:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - name: Install and test the candidate tap
        shell: bash
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/drift-brew-config
        run: |
          uv run --locked python scripts/check_distributions.py release-dist --verify
          tap="$RUNNER_TEMP/drift-tap"
          lock="$RUNNER_TEMP/pylock.toml"
          mkdir -p "$tap/Formula"
          uv export --locked --no-dev --group build --no-emit-project --format pylock.toml --output-file "$lock" > /dev/null
          uv run --locked python scripts/render_homebrew.py release-dist/*.tar.gz "$lock" "$tap/Formula/drift.rb"
          ruby -c "$tap/Formula/drift.rb"
          git -C "$tap" init --quiet
          git -C "$tap" add Formula/drift.rb
          git -C "$tap" -c user.name="Drift CI" -c user.email="drift-ci@example.invalid" commit -qm "Add candidate formula"
          formula=drift-ci/tap/drift
          brew tap --custom-remote drift-ci/tap "file://$tap"
          brew install --build-from-source "$formula"
          brew test "$formula"
          DRIFT_TEST_EXECUTABLE="$(brew --prefix "$formula")/bin/drift" \
            uv run --locked pytest -q tests/integration/test_console_contract.py

  publish-pypi:
    if: >-
      github.repository == 'KiraQiez/Drift' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.DRIFT_RELEASE_ENABLED == 'true'
    needs: [quality, install, homebrew]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/drift-dev-env/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - name: Check and prepare distributions
        working-directory: release-dist
        run: |
          sha256sum --strict --check SHA256SUMS
          mkdir ../dist
          cp -- *.whl *.tar.gz ../dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release-dist && sha256sum --strict --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md release-dist/*.whl release-dist/*.tar.gz release-dist/SHA256SUMS
